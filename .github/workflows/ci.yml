name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting first: it's the fastest check and the cheapest failure to fix
      # (`pnpm format`), so don't spend a build on a PR that only needs a reformat.
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm -r build
      - run: pnpm run typecheck
